name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Lint and unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling and Frappe's HTTP/HTML dependencies
        run: python -m pip install ruff beautifulsoup4 requests urllib3 certifi "anthropic>=1.0"
      - name: Lint
        run: ruff check .
      - name: Validate JSON
        run: python -c "import glob, json; [json.load(open(p, encoding='utf-8')) for p in glob.glob('reckon_sales_agent/**/*.json', recursive=True)]"
      - name: Unit tests (no bench needed)
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: for f in $(git ls-files '*.js'); do node --check "$f"; done
