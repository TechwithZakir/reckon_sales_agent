[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reckon_sales_agent"
version = "0.1.0"
authors = [{name = "Reckon Technologies Ltd."}]
description = "AI-assisted lead discovery and sales follow-up for Frappe CRM"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.setuptools.packages.find]
include = ["reckon_sales_agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
